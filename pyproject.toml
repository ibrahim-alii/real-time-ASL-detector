[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-recognizer"
version = "0.1.0"
description = "Recorded ASL-to-English translation from MMPose landmarks"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
hpc = [
  "transformers>=4.48,<6",
  "sacrebleu>=2.5,<3",
  "bleurt-pytorch>=0.0.1,<1",
]

[project.scripts]
asl-recognizer = "asl_recognizer.translation.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "integration: requires optional local assets",
  "slow: long-running model or dataset test",
  "hardware: requires a camera or accelerator",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["asl_recognizer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mmpose.*", "mmdet.*", "sacrebleu", "bleurt_pytorch", "gdown"]
ignore_missing_imports = true
